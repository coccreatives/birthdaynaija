<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email | BirthdayNaija</title>
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
  <main class="auth auth--center">
    <div class="auth__content">
      <div class="auth__header">
        <span class="auth__feat" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </span>
        <div style="display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center">
          <h1 class="auth__title">Check your email</h1>
          <p class="auth__subtitle">We sent a password reset link to<br><strong data-email>your inbox</strong></p>
        </div>
      </div>

      <div class="auth-actions">
        <a class="auth-btn auth-btn--grad" href="reset.html" style="text-decoration:none">Open email app</a>
      </div>

      <div class="auth-foot">
        <span>Didn't receive the email?</span> <a class="auth-link" href="#" data-resend>Click to resend</a>
      </div>

      <a class="auth-back" href="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to log in
      </a>
    </div>
  </main>
  <script src="assets/js/auth.js" defer></script>
  <script>
    document.querySelector("[data-resend]").addEventListener("click", function(e){ e.preventDefault(); window.BNToast("Reset link sent again."); });
  </script>
</body>
</html>

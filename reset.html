<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password | BirthdayNaija</title>
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
  <main class="auth auth--center">
    <div class="auth__content">
      <div class="auth__header">
        <span class="auth__feat" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <div style="display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center">
          <h1 class="auth__title">Set new password</h1>
          <p class="auth__subtitle">Your new password must be different to previously used passwords.</p>
        </div>
      </div>

      <form class="auth__form" data-auth-form data-pw-rules data-next="reset-done.html" novalidate>
        <div class="auth-field">
          <label class="auth-field__label" for="new-password">Password</label>
          <div class="auth-input-wrap">
            <input class="auth-input auth-input--pw" id="new-password" type="password" placeholder="••••••••" data-min="8" required>
            <button type="button" class="auth-eye" data-eye aria-label="Show password"></button>
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-field__label" for="confirm">Confirm password</label>
          <div class="auth-input-wrap">
            <input class="auth-input auth-input--pw" id="confirm" type="password" placeholder="••••••••" data-match="#new-password" required>
            <button type="button" class="auth-eye" data-eye aria-label="Show password"></button>
          </div>
          <span class="auth-field__error">Passwords must match.</span>
        </div>

        <div class="auth-rules">
          <div class="auth-rule" data-rule-len><span class="auth-rule__dot"></span> Must be at least 8 characters</div>
          <div class="auth-rule" data-rule-special><span class="auth-rule__dot"></span> Must contain one special character</div>
        </div>

        <div class="auth-actions">
          <button type="submit" class="auth-btn auth-btn--grad">Reset password</button>
        </div>
      </form>

      <a class="auth-back" href="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to log in
      </a>
    </div>
  </main>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
